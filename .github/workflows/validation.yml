name: WEAREONE10BILLION Validation Gate

permissions:
  contents: read

on:
  workflow_run:
    workflows:
      - "WEAREONE10BILLION Sandbox Test"
    types:
      - completed

jobs:
  validate:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    environment:
      name: approved

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Validation
        run: |
          python rabbitsync/validator.py

      - name: Generate Report
        run: |
          python rabbitsync/report.py
